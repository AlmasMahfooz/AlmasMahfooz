name: Update Credly Badges

on:
  schedule:
    - cron: "0 9 * * 1" # Runs every Monday at 9 AM UTC
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync Credly Badges (Including Other Tab)
        uses: Sagargupta16/credly-badge-readme-action@v1
        with:
          credly-username: "almas-mahfooz"
          include-other: true
          output: svg
      - name: Commit the card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/credly-badges.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Credly badge card"
            git push
          fi
