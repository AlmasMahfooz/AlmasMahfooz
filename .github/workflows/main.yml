- name: Credly Badges Updater
  # You may pin to the exact commit or the version.
  # uses: hairbui76/credly-badges@6bf05d028475ab514aeee52e1b25853f923f939f
  uses: hairbui76/credly-badges@v1.0.4
  with:
    # Credly username
    CREDLY_USER: almas-mahfooz
    # Git commit message
    GIT_COMMIT_MESSAGE: # optional, default is Update Credly badges
    # Git user name for commits
    GIT_USER_NAME: # optional, default is github-actions[bot]
    # Git user email for commits
    GIT_USER_EMAIL: # optional, default is github-actions[bot]@users.noreply.github.com
    # Size of badge images (width and height)
    BADGE_SIZE: # optional, default is 80
    # README file name
    README_FILE: # optional, default is README.md
